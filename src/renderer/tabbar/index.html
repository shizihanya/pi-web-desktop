<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'"
    />
    <title>Pi Web Desktop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 单栏：完全保持原来的页签栏；分屏时整条隐藏 -->
    <div class="tabbar" id="tabbar">
      <div class="tabs" id="tabs"></div>
      <div class="drag-strip" id="drag-strip"></div>
      <div class="window-tools" id="window-tools">
        <button
          class="split-button"
          id="split-button"
          title="分屏 (Ctrl+\) · 拖动页签可放到任意一侧"
          aria-label="分屏"
          type="button"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <rect
              x="2"
              y="3"
              width="12"
              height="10"
              rx="1.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            />
            <path d="M8 3v10" stroke="currentColor" stroke-width="1.3" />
          </svg>
        </button>
        <button class="new-tab" id="new-tab" title="新页签 (Ctrl+T)" type="button">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <button
          class="settings-button"
          id="open-settings"
          title="Pi Web Desktop 设置…"
          aria-label="Pi Web Desktop 设置"
          type="button"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              d="M2 4.5h12M2 8h12M2 11.5h12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
            <circle cx="6" cy="4.5" r="1.7" stroke="currentColor" stroke-width="1.3" />
            <circle cx="10.5" cy="8" r="1.7" stroke="currentColor" stroke-width="1.3" />
            <circle cx="5.5" cy="11.5" r="1.7" stroke="currentColor" stroke-width="1.3" />
          </svg>
        </button>
        <div class="status" id="status" title="服务状态">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">…</span>
        </div>
      </div>
    </div>

    <!-- 分屏：每个窗格一条自己的页签条，绝对定位到该窗格顶部（VSCode 编辑器组） -->
    <div class="pane-layer" id="pane-layer"></div>

    <!-- 拖动页签时的投放区（内容视图已由主进程临时隐藏） -->
    <div class="drag-overlay" id="drag-overlay" hidden></div>

    <script type="module" src="./tabbar.ts"></script>
  </body>
</html>
