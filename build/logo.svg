<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 1. 左腿（蓝色部分）：顺滑等宽与自然弯曲 -->
  <g id="blue-leg">
    <!-- 主体蓝色 -->
    <path d="M 27.5 28 
             L 44.0 28 
             L 44.0 71.5 
             C 44.0 82.5, 35.0 91.0, 24.5 91.0 
             L 12.5 91.0 
             C 11.2 91.0, 10.5 90.0, 10.5 88.5 
             L 10.5 76.5 
             C 10.5 75.2, 11.5 74.5, 12.8 74.5 
             L 20.0 74.5 
             C 24.5 74.5, 27.5 71.5, 27.5 67.0 
             Z" fill="#5293B6" />
    <!-- 顶部衔接微阴影条 -->
    <rect x="27.5" y="28" width="16.5" height="3.2" fill="#4C8BAB" opacity="0.35" />
  </g>

  <!-- 2. 右腿（黄色部分）：微调后匀称厚度与特征折足 -->
  <g id="yellow-leg">
    <!-- 主体黄色 -->
    <path d="M 59.5 28 
             L 76.8 28 
             L 76.8 67.5 
             C 76.8 71.0, 78.5 73.0, 81.0 74.0 
             L 91.0 74.0 
             C 92.5 74.0, 93.2 75.0, 93.2 76.5 
             L 93.2 88.5 
             C 93.2 90.0, 92.2 91.0, 90.8 91.0 
             L 78.5 91.0 
             C 67.5 91.0, 59.5 82.0, 59.5 71.0 
             Z" fill="#EDB530" />
    <!-- 顶部衔接微阴影条 -->
    <rect x="59.5" y="28" width="17.3" height="3.2" fill="#DEAB2B" opacity="0.35" />
  </g>

  <!-- 3. 顶部横梁（珊瑚红部分）：黄金比例自然弧度与右端圆角 -->
  <path id="coral-bar" d="M 23.0 9.5 
           L 90.5 9.5 
           C 92.2 9.5, 93.2 10.8, 93.2 12.5 
           L 93.2 24.8 
           C 93.2 26.5, 92.0 27.8, 90.5 27.8 
           L 27.0 27.8 
           C 22.5 27.8, 21.0 30.5, 21.0 33.2 
           C 21.0 34.5, 20.0 35.0, 18.5 35.0 
           L 8.5 35.0 
           C 7.2 35.0, 6.5 34.0, 6.5 32.5 
           C 6.5 23.0, 12.5 9.5, 23.0 9.5 
           Z" fill="#ED6558" />
</svg>